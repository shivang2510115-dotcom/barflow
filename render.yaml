services:
  # ---------------------------------------------------------------- API
  - type: web
    name: barflow-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/
    envVars:
      # Mongo Atlas connection string. Paste in the Render dashboard, never commit it.
      # Leave it unset and the app silently falls back to the mock JSON store, which is
      # wiped on every restart and every redeploy.
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: barflow
      # Generated once by Render. Rotating it invalidates every issued login token.
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      # Required. Leave this blank and the app seeds the published default "admin123".
      - key: ADMIN_PASSWORD
        sync: false
      # Suppresses the manager/waiter/kitchen demo logins, whose passwords are in the
      # repo. Must stay "false" on anything reachable from the internet.
      - key: DEMO_LOGINS
        value: "false"
      - key: CURRENCY_SYMBOL
        value: "₹"
      # Full origin WITH scheme, e.g. https://barflow-web.onrender.com
      # Comma-separated if there is more than one. Set by hand after the first deploy,
      # once the site's real URL exists — until it is set the API refuses to start and
      # says so in the deploy log, because a browser CORS error on somebody else's
      # machine is a far worse way to find out.
      # "*" is refused outright: allow_credentials is on, so a wildcard origin would let
      # any website call this API with a logged-in user's session.
      - key: CORS_ORIGINS
        sync: false
      - key: DAILY_BRIEF_ENABLED
        value: "false"
      - key: OWNER_BRIEF_TIME
        value: "23:00"
      - key: OWNER_PHONE
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      # The signing secret of the Stripe webhook endpoint ("whsec_..."), copied from the
      # Stripe dashboard. It is what proves a webhook came from Stripe rather than from
      # a stranger with the URL — settling an order is what believing one does.
      # Leave it unset and every webhook is refused with a 503, so online payments never
      # settle. That is deliberate: a webhook that cannot verify and accepts anything
      # would let anyone settle any order on the platform without paying.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Encrypts guest identity-document numbers (Aadhaar, passport, licence) at rest.
      # A urlsafe base64 32-byte Fernet key — NOT generateValue, which produces a string
      # Fernet will not accept. Make one with:
      #   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Leave it unset and those numbers are stored in plain text, exactly as they were
      # before this variable existed, with a warning at startup. That is deliberate: a
      # hotel mid-check-in must not lose the ability to register a guest over a missing
      # variable.
      # Set it and forget it at your peril — if the key is lost or changed, every number
      # written under it is unrecoverable, and the front desk sees an empty field. Keep
      # it wherever the Mongo password is kept. To rotate, list the new key first and the
      # old one second, comma-separated, re-run migrations/encrypt_guest_ids.py (startup
      # does it too), then drop the old one.
      - key: GUEST_ID_ENCRYPTION_KEY
        sync: false
      # The platform operator: the one account that approves, suspends and restores
      # hotels. It belongs to no hotel and every hotel endpoint refuses it, so it is not
      # a master key into anyone's guest data — it sees that a hotel exists and how big
      # it is, nothing about who stayed there.
      # Leave EITHER of these unset and no operator is seeded, which means nobody can
      # approve a hotel and every signup sits pending forever. There is deliberately no
      # default password: this account can approve every hotel on the platform.
      # How many proxies sit in front of this app. X-Forwarded-For is a list the client
      # starts and each proxy appends to, so the entries a client can forge are on the
      # LEFT and the ones a proxy wrote are on the RIGHT — rate limits count from the
      # right by this many hops, which is what makes the address unforgeable.
      #   1  direct to Render (correct for this file as it stands)
      #   2  Cloudflare or another CDN in front of Render
      #   0  no proxy — ignore the header and use the socket
      # Too high and every client looks like one forged address; too low and the client
      # chooses its own.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      # Both default to demo behaviour, which must stay off in public: DEMO_LOGINS seeds
      # staff accounts whose passwords are published in this repository, and
      # SEED_DEMO_CONTENT fills a brand-new hotel with somebody else's rooms and menu.
      - key: SEED_DEMO_CONTENT
        value: "false"

  # ---------------------------------------------------------------- Web
  - type: web
    name: barflow-web
    runtime: static
    rootDir: ./frontend
    # No `plan` here: Render static sites have no plan tier and reject the field.
    buildCommand: npm ci && CI=false npm run build
    staticPublishPath: ./build
    envVars:
      # Full origin WITH scheme, e.g. https://barflow-api.onrender.com
      # This is COMPILE-time, not runtime: changing it needs a rebuild, not a restart.
      - key: REACT_APP_BACKEND_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
    routes:
      # React Router owns the paths; hand every unknown URL to index.html
      # or a refresh on /app/reports returns 404.
      - type: rewrite
        source: /*
        destination: /index.html
